name: Deploy front no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/menupro/**'
      - 'lib/api-client-react/**'
      - 'lib/api-zod/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Duas coisas atrapalham o install no CI:
      # 1. o preinstall do repo usa sh (Unix) -- funciona aqui, quebra no Windows;
      # 2. o pnpm 11 aborta em politicas de supply-chain / build scripts quando
      #    nao ha cache local de verificacao, que e sempre o caso num runner novo.
      # Por isso o step tem um encadeamento de tentativas e joga o log no resumo
      # do job, que aparece na pagina publica do run mesmo sem login.
      - name: Instalar dependencias
        run: |
          set -o pipefail
          summary="$GITHUB_STEP_SUMMARY"
          try() {
            echo "### tentativa: pnpm install $*" >> "$summary"
            echo '```' >> "$summary"
            if pnpm install "$@" 2>&1 | tee install-attempt.log; then
              echo '```' >> "$summary"
              return 0
            fi
            echo '```' >> "$summary"
            tail -n 40 install-attempt.log >> "$summary"
            return 1
          }
          ok=0
          try --frozen-lockfile \
            --config.strict-dep-builds=false \
            --config.minimum-release-age=0 || ok=1
          if [ "$ok" = 1 ]; then
            try --no-frozen-lockfile \
              --config.strict-dep-builds=false \
              --config.minimum-release-age=0 || ok=1
          fi
          if [ "$ok" = 1 ]; then
            echo "### fallback final: --ignore-scripts" >> "$summary"
            try --no-frozen-lockfile --ignore-scripts \
              --config.strict-dep-builds=false \
              --config.minimum-release-age=0 || ok=1
          fi
          [ "$ok" = 0 ] && exit 1

      - name: Build do front
        env:
          # Site de projeto: o base tem que incluir o nome do repo.
          BASE_PATH: /Pro-Cardapio-Digital-SaaS/
          PORT: 3002
          NODE_ENV: production
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: pnpm --filter @workspace/menupro run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/menupro/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
