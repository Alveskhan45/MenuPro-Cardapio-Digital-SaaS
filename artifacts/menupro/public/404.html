<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>MenuPro</title>
    <script>
      /* GitHub Pages nao tem fallback de SPA: /dashboard direto devolve 404.
         Este arquivo vira o index.html via reload, preservando o caminho. */
      sessionStorage.setItem('menupro:redirect', location.href);
      location.replace(
        location.pathname.replace(/\/[^/]*$/, '/') +
          'index.html' +
          (location.search || '') +
          location.hash
      );
    </script>
  </head>
  <body></body>
</html>
